name: Windows Build (EXE + MSI)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (default: dari config.json)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build EXE (PyInstaller)
        shell: bash
        run: python build.py

      - name: Install WiX Toolset v3 (untuk MSI)
        id: wix
        continue-on-error: true
        run: choco install wixtoolset -y --no-progress

      - name: Verify EXE
        shell: bash
        run: ls -la dist/ | grep -iE '\.exe$' && file dist/*.exe || true

      - name: Build MSI (WiX via build_msi.bat)
        if: steps.wix.outcome == 'success'
        shell: cmd
        run: installer\build_msi.bat
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trayprint-windows
          path: |
            dist/*.exe
            dist/*.msi
          if-no-files-found: error
